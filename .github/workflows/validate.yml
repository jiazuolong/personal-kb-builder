name: validate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate demo KB
        run: python scripts/check.py --kb examples/demo-kb --check-sources
      - name: Check skill frontmatter size
        run: python -c "import pathlib; p=pathlib.Path('SKILL.md'); assert len(p.read_text(encoding='utf-8')) < 8000, 'SKILL.md too long'"
